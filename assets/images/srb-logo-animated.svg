<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 70" width="350" height="70">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="srb-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="60%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#E64A00"/>
    </linearGradient>

    <linearGradient id="srb-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2240"/>
      <stop offset="35%" stop-color="#1B3A60"/>
      <stop offset="70%" stop-color="#E85D04"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>

    <linearGradient id="speed-trail-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#FF5500" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="headlight-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C4FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dynamic speed trails */
    @keyframes speedStreamA {
      0%, 100% { transform: scaleX(0.75); opacity: 0.4; }
      50% { transform: scaleX(1.2); opacity: 1; }
    }
    @keyframes speedStreamB {
      0%, 100% { transform: scaleX(0.85); opacity: 0.5; }
      50% { transform: scaleX(1.3); opacity: 0.95; }
    }
    /* Arrow forward thrust */
    @keyframes arrowThrust {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }
    /* Wheel rotation */
    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* Truck vibration */
    @keyframes roadMotion {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.7px); }
    }
    /* Headlight pulse */
    @keyframes lightPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }

    .trail-1 { animation: speedStreamA 1.1s infinite ease-in-out; transform-origin: left; }
    .trail-2 { animation: speedStreamB 0.85s infinite ease-in-out; transform-origin: left; }
    .arrow-thrust { animation: arrowThrust 1.4s infinite ease-in-out; }
    .wheel-turn { transform-origin: center; animation: wheelSpin 1.6s infinite linear; }
    .truck-body { animation: roadMotion 2s infinite ease-in-out; }
    .beam-pulse { animation: lightPulse 1.3s infinite ease-in-out; }
  </style>

  <!-- Complete Vector Graphic of Truck & Motion (Scaled & Centered) -->
  <g class="truck-body" transform="translate(4, 7)">

    <!-- Speed Trails (Horizontal dynamic streaks behind cargo) -->
    <g stroke="url(#speed-trail-grad)" stroke-linecap="round">
      <line x1="2" y1="16" x2="28" y2="16" stroke-width="2.5" class="trail-1" />
      <line x1="8" y1="21" x2="31" y2="21" stroke-width="3" class="trail-2" />
      <line x1="0" y1="26" x2="26" y2="26" stroke-width="3.5" class="trail-1" />
      <line x1="7" y1="31" x2="30" y2="31" stroke-width="3" class="trail-2" />
      <line x1="12" y1="36" x2="28" y2="36" stroke-width="2.5" class="trail-1" />
    </g>

    <!-- Orange Cargo Box -->
    <polygon points="30,12 88,10 88,43 30,43" fill="url(#srb-orange-grad)" />

    <!-- Forward Speed Arrow Inside Cargo Box -->
    <g class="arrow-thrust">
      <polygon points="30,24 64,24 64,19 79,27 64,35 64,30 30,30" fill="#FFFFFF" />
    </g>

    <!-- Deep Navy Truck Cab (Aerodynamic front) -->
    <path d="M89,11 L99,11 C105,11 110,13 113,19 L120,29 C122,32 123,35 123,38 L123,47 C123,48.5 121.5,50 120,50 L89,50 Z" 
          fill="#0F2240" />

    <!-- Windshield Glass (Curved & White Highlight) -->
    <path d="M101,15 L108,15 C111,15 113.5,17 115,20 L118.5,27 L101,27 Z" fill="#FFFFFF" />
    <!-- Side Door Window -->
    <rect x="93" y="17" width="6" height="10" rx="1" fill="#FFFFFF" opacity="0.9" />

    <!-- Front Radiator Grille (Curved White Horizontal Slats) -->
    <g fill="#FFFFFF">
      <path d="M117,33 L122.5,34 C122,35.5 120,35.5 117,35 Z" />
      <path d="M117,36.5 L122.5,37.5 C122,39 120,39 117,38.5 Z" />
      <path d="M117,40 L122.5,41 C122,42.5 120,42.5 117,42 Z" />
    </g>

    <!-- Illuminated Headlight Beam -->
    <polygon points="123,37 145,33 145,43 123,41" fill="url(#headlight-beam)" class="beam-pulse" />
    <circle cx="122.5" cy="39" r="1.8" fill="#00C4FF" filter="url(#soft-glow)" />

    <!-- Chassis Guard Rail -->
    <rect x="30" y="43" width="90" height="3" fill="#0F2240" />

    <!-- Wheels (Deep Navy with White Rim & Rotating Hub Indicators) -->
    <!-- Rear Wheel 1 -->
    <g transform="translate(42, 48)">
      <circle cx="0" cy="0" r="7.5" fill="#0F2240" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
      <g class="wheel-turn">
        <circle cx="-1.8" cy="-1.8" r="0.75" fill="#FF5500" />
        <circle cx="1.8" cy="1.8" r="0.75" fill="#FF5500" />
      </g>
    </g>

    <!-- Rear Wheel 2 -->
    <g transform="translate(58, 48)">
      <circle cx="0" cy="0" r="7.5" fill="#0F2240" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
      <g class="wheel-turn">
        <circle cx="-1.8" cy="-1.8" r="0.75" fill="#FF5500" />
        <circle cx="1.8" cy="1.8" r="0.75" fill="#FF5500" />
      </g>
    </g>

    <!-- Front Steer Wheel -->
    <g transform="translate(106, 48)">
      <circle cx="0" cy="0" r="7.5" fill="#0F2240" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
      <g class="wheel-turn">
        <circle cx="-1.8" cy="-1.8" r="0.75" fill="#FF5500" />
        <circle cx="1.8" cy="1.8" r="0.75" fill="#FF5500" />
      </g>
    </g>

  </g>

  <!-- BRAND NAME & SLOGAN TYPOGRAPHY -->
  <g transform="translate(142, 8)">
    
    <!-- Bold 'SRB' Text (Navy to Orange Gradient) -->
    <text x="0" y="32" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#srb-text-grad)" letter-spacing="1">
      SRB
    </text>

    <!-- Bold 'LOGISTIC' (Deep Navy Solid) -->
    <text x="75" y="32" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="900" fill="#0F2240" letter-spacing="1.5">
      LOGISTIC
    </text>

    <!-- Slogan: EFFICIENT TRANSPORT SOLUTIONS -->
    <g transform="translate(1, 48)">
      <circle cx="3" cy="-3.5" r="2.2" fill="#FF5500" />
      <text x="10" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9" font-weight="900" fill="#0F2240" letter-spacing="1.6">
        EFFICIENT TRANSPORT SOLUTIONS
      </text>
    </g>

  </g>
</svg>